[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evogen"
version = "0.1.0"
description = "Evidence-driven outer-loop capability engineering for autonomous agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "EvoGen contributors"}]
keywords = ["agents", "autonomy", "evaluation", "capability-engineering", "middleware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.8,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "setuptools==80.9.0",
]

[project.scripts]
evogen = "evogen.cli:main"

[project.entry-points."evogen.subjects"]
microworld = "evogen.demo.microworld.plugin:build_subject_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evogen = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/evogen/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
